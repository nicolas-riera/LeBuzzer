name: Google Chat Webhook Simple

on:
  push:
    branches: [ "main" ]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer message Google Chat
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"text\": \"🚀 Nouveau push sur **${{ github.repository }}** par **${{ github.actor }}**\nCommit : ${{ github.event.head_commit.message }}\"}" \
            "${{ secrets.GOOGLE_CHAT_WEBHOOK }}"
